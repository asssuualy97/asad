<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>एक छोटी सी बात... ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ff5f7e;
  --pink2:#ff8da3;
  --purple:#b9a8ff;
  --gold:#ffd477;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:'Noto Sans Devanagari',sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#681e45 0%,#3a1128 45%,#180913 100%);
  color:#fff;
  overflow:hidden;
}

#app{
  position:relative;
  width:100%;
  max-width:460px;
  height:100vh;
  margin:auto;
  overflow:hidden;
}

#hearts{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.heart{
  position:absolute;
  bottom:-50px;
  opacity:0;
  animation:floatHeart linear forwards;
  filter:drop-shadow(0 0 7px rgba(255,95,126,.7));
}

@keyframes floatHeart{
  0%{
    transform:translateY(0) translateX(0) rotate(0);
    opacity:0;
  }
  10%{opacity:.7}
  100%{
    transform:translateY(-110vh) translateX(var(--drift)) rotate(360deg);
    opacity:0;
  }
}

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  z-index:2;
  overflow-y:auto;
}

.screen.active{
  display:flex;
  animation:appear .6s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:scale(.96) translateY(10px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.card{
  width:100%;
  max-width:330px;
  padding:38px 25px;
  border-radius:28px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.intro-emoji{
  font-size:58px;
  margin-bottom:15px;
  animation:wave 2s infinite;
}

@keyframes wave{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(12deg)}
  50%{transform:rotate(-8deg)}
}

.intro-text{
  font-size:18px;
  line-height:2;
  color:#ffe7ed;
}

.intro-text b{
  color:#fff;
}

.note{
  margin-top:15px;
  font-size:12px;
  color:#ffbdcc;
}

.btn{
  margin-top:24px;
  border:0;
  padding:14px 31px;
  border-radius:50px;
  color:#fff;
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(120deg,var(--pink),var(--pink2));
  box-shadow:0 10px 28px rgba(255,95,126,.45);
  transition:.2s;
}

.btn:active{
  transform:scale(.94);
}

.load-heart{
  font-size:65px;
  animation:beat 1.2s infinite;
}

@keyframes beat{
  0%,100%{transform:scale(1)}
  25%{transform:scale(1.15)}
  45%{transform:scale(1)}
  65%{transform:scale(1.1)}
}

#loadText{
  margin-top:20px;
  min-height:55px;
  font-size:17px;
  color:#ffd6e0;
}

.bar{
  width:280px;
  height:8px;
  margin-top:18px;
  background:rgba(255,255,255,.15);
  border-radius:20px;
  overflow:hidden;
}

.fill{
  width:0;
  height:100%;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  border-radius:20px;
}

#percent{
  margin-top:8px;
  font-size:13px;
  color:#ffb9c9;
}

.envelope{
  position:relative;
  z-index:6;
  pointer-events:auto;
  width:230px;
  height:155px;
  cursor:pointer;
  filter:drop-shadow(0 20px 25px rgba(0,0,0,.4));
}

.env-back{
  position:absolute;
  inset:0;
  border-radius:12px;
  background:linear-gradient(145deg,#ffeaf0,#ffcbd8);
}

.env-letter{
  position:absolute;
  left:15px;
  right:15px;
  bottom:10px;
  height:25px;
  background:white;
  border-radius:6px;
  z-index:2;
  transition:.6s;
}

.env-flap{
  position:absolute;
  top:0;
  left:0;
  width:0;
  height:0;
  border-left:115px solid transparent;
  border-right:115px solid transparent;
  border-top:82px solid #ffc3d2;
  transform-origin:top;
  transition:.7s;
  z-index:4;
}

.envelope.open .env-flap{
  transform:rotateX(180deg);
}

.envelope.open .env-letter{
  height:115px;
  transform:translateY(-55px);
}

.hint{
  margin-top:30px;
  color:#ffd4df;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{opacity:.45}
}

.message-card{
  width:100%;
  max-width:340px;
  background:linear-gradient(160deg,#fff,#ffeef2);
  color:#492033;
  border-radius:28px;
  padding:36px 25px 30px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.eyebrow{
  font-family:'Dancing Script',cursive;
  color:var(--pink);
  font-size:40px;
  margin-bottom:20px;
}

#messageText{
  min-height:210px;
  font-size:17px;
  line-height:1.9;
  font-weight:500;
  color:#fff4fb;
  text-shadow:0 1px 4px rgba(0,0,0,.55);
}

.dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:20px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#c9aeb8;
}

.dot.active{
  width:20px;
  border-radius:10px;
  background:var(--pink);
}

.question-icon{
  font-size:60px;
  margin-bottom:15px;
}

.question-title{
  font-size:27px;
  font-weight:800;
  line-height:1.5;
  margin-bottom:25px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.option{
  border:0;
  padding:13px 20px;
  border-radius:50px;
  color:white;
  font-family:inherit;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  background:linear-gradient(120deg,var(--pink),var(--purple));
}

.story-heart{
  font-size:70px;
  animation:beat 1.3s infinite;
}

.story-title{
  font-family:'Dancing Script',cursive;
  font-size:50px;
  color:var(--gold);
  margin-top:10px;
}

.story-text{
  margin-top:18px;
  max-width:320px;
  font-size:16px;
  line-height:1.9;
  color:#ffe4ea;
}

.final-card{
  width:100%;
  max-width:335px;
  padding:38px 25px;
  border-radius:28px;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.17);
  backdrop-filter:blur(10px);
}

.final-question{
  font-size:26px;
  font-weight:800;
  line-height:1.55;
}

.yes{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:50px;
  color:white;
  background:linear-gradient(120deg,var(--pink),var(--pink2));
  box-shadow:0 12px 30px rgba(255,95,126,.5);
  font-family:inherit;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.no{transition:.25s;
  margin-top:15px;
  padding:12px 22px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  color:#ffd6e0;
  font-family:inherit;
  cursor:pointer;
}


.noChoice{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-2deg)}50%{transform:translateX(8px) rotate(2deg)}75%{transform:translateX(-5px)}}

.noChoice{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-2deg)}50%{transform:translateX(8px) rotate(2deg)}75%{transform:translateX(-5px)}}

.yay{
  font-family:'Dancing Script',cursive;
  font-size:62px;
  color:var(--gold);
  animation:pop .8s ease;
}

@keyframes pop{
  0%{transform:scale(.3);opacity:0}
  70%{transform:scale(1.15)}
  100%{transform:scale(1)}
}

.celebrate{
  max-width:325px;
  margin-top:18px;
  font-size:16px;
  line-height:1.9;
  color:#ffe4ea;
}

.big-heart{
  font-size:65px;
  margin-top:18px;
  animation:beat 1.2s infinite;
}

/* LOVE PAGES */

.love-heart{
  font-size:75px;
  animation:beat 1.3s infinite;
}

.love-title{
  font-family:'Dancing Script',cursive;
  font-size:55px;
  color:var(--gold);
  text-shadow:
    0 0 12px rgba(255,212,119,.7),
    0 0 35px rgba(255,95,126,.6);
}

.love-name{
  margin-top:5px;
  font-size:20px;
  font-weight:700;
}

.love-message{
  margin-top:17px;
  max-width:320px;
  font-size:15px;
  line-height:1.9;
  color:#ffe4ea;
}

.write-box{
  width:100%;
  max-width:315px;
  margin-top:20px;
  padding:17px;
  border-radius:20px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);
}

.write-title{
  font-size:14px;
  color:#ffd2dc;
  margin-bottom:10px;
}

.loveInput{
  width:100%;
  height:80px;
  resize:none;
  border:0;
  outline:0;
  border-radius:14px;
  padding:12px;
  font-family:inherit;
  font-size:14px;
  color:#542335;
  background:#fff1f4;
}

.count{
  text-align:right;
  margin-top:5px;
  font-size:11px;
  color:#ffb9c9;
}

.save-note{
  margin-top:10px;
  font-size:10px;
  color:#ffc4d1;
  line-height:1.5;
}

.success{
  font-size:18px;
  line-height:2;
  color:#ffe4ea;
}

.confetti{
  position:absolute;
  top:-30px;
  z-index:30;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

/* Envelope open button */
.envelope-open-btn{margin-top:18px;min-width:190px;position:relative;z-index:5}

/* Animated listener badge */
#listenerBadge{position:absolute;right:12px;top:12%;z-index:4;display:none;align-items:center;justify-content:center;width:72px;height:88px;padding:3px;border-radius:24px;background:rgba(18,5,28,.30);border:1px solid rgba(255,160,213,.38);box-shadow:0 0 22px rgba(255,73,154,.28);backdrop-filter:blur(3px);animation:listenerFloat 2.2s ease-in-out infinite;pointer-events:none;overflow:hidden}
#listenerBadge.show{display:flex}
#listenerAvatar{width:100%;height:100%;display:block;border-radius:20px;background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:inset 0 0 18px rgba(255,105,170,.20);animation:listenerBlink 3s ease-in-out infinite}
#listenerText{display:none}
@keyframes listenerFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes listenerBlink{0%,42%,48%,100%{transform:scaleY(1)}45%{transform:scaleY(.72)}}

/* =========================================================
   ANIME CINEMATIC BACKGROUND / MOTION
   ========================================================= */

body{
  background:
    radial-gradient(circle at 50% 10%,#7b2458 0%,#35102e 38%,#090611 100%);
}

#app{
  isolation:isolate;
  background:
    radial-gradient(circle at 50% 100%,rgba(255,76,151,.13),transparent 45%);
}

#animeScene{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 25%,rgba(255,84,155,.24),transparent 30%),
    linear-gradient(150deg,#100818,#2a0b2b 48%,#090611);
}

#sceneImage{
  position:absolute;
  width:112%;
  height:112%;
  left:-6%;
  top:-6%;
  object-fit:cover;
  object-position:center;
  opacity:.72;
  filter:saturate(1.12) contrast(1.03) brightness(.78);
  transform:scale(1.02);
  transition:opacity .45s ease, filter .45s ease;
  animation:animeBreath 9s ease-in-out infinite alternate;
}

@keyframes animeBreath{
  0%{transform:scale(1.02) translate3d(-1%,0,0)}
  50%{transform:scale(1.08) translate3d(1%, -1%,0)}
  100%{transform:scale(1.04) translate3d(-.5%,1%,0)}
}

.sceneShade{
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,rgba(9,4,17,.15),rgba(9,4,17,.52) 70%,rgba(7,3,13,.88)),
    radial-gradient(circle at 50% 45%,transparent 0 35%,rgba(8,3,15,.38) 90%);
}

.sceneGlow{
  position:absolute;
  width:70vw;
  height:70vw;
  max-width:360px;
  max-height:360px;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,75,155,.18),transparent 68%);
  filter:blur(8px);
  animation:glowPulse 3.8s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
}

.sceneSparkles,.sceneHearts{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.sceneSparkle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 10px 3px rgba(255,160,220,.9);
  animation:twinkle 1.5s ease-in-out infinite;
}

@keyframes twinkle{
  0%,100%{opacity:.1;transform:scale(.4)}
  50%{opacity:1;transform:scale(1.5)}
}

.sceneHeart{
  position:absolute;
  bottom:-30px;
  color:#ff82b1;
  text-shadow:0 0 10px rgba(255,82,155,.9);
  animation:sceneHeartFloat linear forwards;
}

@keyframes sceneHeartFloat{
  0%{transform:translate3d(0,0,0) scale(.5) rotate(-10deg);opacity:0}
  12%{opacity:.8}
  100%{transform:translate3d(var(--x),-115vh,0) scale(1.2) rotate(25deg);opacity:0}
}

/* Glass cards now blend into the anime scene */
.card,.final-card{
  background:linear-gradient(145deg,rgba(28,8,34,.72),rgba(12,5,22,.56));
  border:1px solid rgba(255,173,216,.28);
  box-shadow:
    0 25px 70px rgba(0,0,0,.5),
    inset 0 0 25px rgba(255,100,180,.05);
}

.message-card{
  background:linear-gradient(145deg,rgba(255,248,251,.96),rgba(255,226,237,.93));
  box-shadow:0 25px 70px rgba(0,0,0,.52),0 0 35px rgba(255,82,155,.16);
}

.screen.active{
  animation:animePageIn .7s cubic-bezier(.2,.75,.25,1);
}

@keyframes animePageIn{
  0%{opacity:0;transform:scale(.94) translateY(24px)}
  60%{opacity:1;transform:scale(1.015) translateY(-2px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* Character-style floating motion for the visible scene */
.screen.active .story-heart,
.screen.active .love-heart,
.screen.active .load-heart,
.screen.active .big-heart{
  animation:characterFloat 2.8s ease-in-out infinite;
}

@keyframes characterFloat{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-10px) rotate(1deg)}
}

/* Neon buttons like the reference */
.btn,.yes,.option{
  background:linear-gradient(135deg,#ff477e,#ff8eb4 55%,#b77cff);
  box-shadow:
    0 9px 25px rgba(255,65,126,.35),
    0 0 18px rgba(255,104,183,.18);
}

.no{
  background:rgba(24,7,31,.72);
  border-color:rgba(255,142,190,.35);
}

.love-title,.story-title,.yay{
  text-shadow:0 0 10px rgba(255,144,205,.7),0 0 28px rgba(255,72,151,.45);
}

@media (prefers-reduced-motion:reduce){
  #sceneImage,.sceneGlow,.sceneSparkle,.sceneHeart,
  .screen.active,.screen.active .story-heart,
  .screen.active .love-heart,.screen.active .load-heart,
  .screen.active .big-heart{animation:none!important}
}


/* =========================================================
   V2 — DARK ANIME STORY MODE
   Removes the white message panel and adds dialogue bubbles.
   ========================================================= */

.message-card{
  width:100%;
  max-width:370px;
  min-height:430px;
  padding:30px 20px 24px;
  border-radius:30px;
  color:#fff;
  background:
    linear-gradient(145deg,rgba(13,7,25,.58),rgba(37,8,38,.48));
  border:1px solid rgba(255,147,205,.32);
  backdrop-filter:blur(7px);
  box-shadow:
    0 24px 65px rgba(0,0,0,.55),
    0 0 35px rgba(255,72,151,.15);
  position:relative;
  overflow:hidden;
}

.message-card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:32px;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,110,182,.18),transparent 30%),
    radial-gradient(circle at 80% 85%,rgba(157,99,255,.15),transparent 32%);
  pointer-events:none;
}

.message-card > *{
  position:relative;
  z-index:1;
}

.eyebrow{
  font-family:'Dancing Script',cursive;
  color:#ff9dcc;
  font-size:34px;
  text-shadow:0 0 12px rgba(255,88,170,.7);
}

#messageText{
  min-height:245px;
  padding:22px 18px;
  border-radius:24px;
  color:#fff8fc;
  font-size:17px;
  line-height:2;
  font-weight:600;
  text-shadow:0 2px 5px rgba(0,0,0,.65);
  background:rgba(8,4,17,.30);
  border:1px solid rgba(255,155,207,.16);
}

/* Each message appears like a speech/dialogue scene. */
#messageText .dialogue{
  display:block;
  margin:8px auto;
  padding:10px 14px;
  width:fit-content;
  max-width:94%;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(255,73,132,.20),rgba(151,90,255,.18));
  border:1px solid rgba(255,166,214,.24);
  box-shadow:0 0 18px rgba(255,67,148,.12);
  animation:bubbleIn .65s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes bubbleIn{
  from{opacity:0;transform:translateY(14px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

#messageText .dialogue:nth-child(even){
  animation-delay:.12s;
}

#messageButton{
  min-width:130px;
}

/* Story/celebrate/love pages get the same dark cinematic treatment. */
.story-text,
.love-message,
.celebrate,
.success{
  padding:18px 18px;
  border-radius:22px;
  background:rgba(7,3,16,.34);
  border:1px solid rgba(255,145,205,.16);
  text-shadow:0 2px 5px rgba(0,0,0,.55);
}

/* The scene remains visible behind every page. */
.screen{
  background:transparent!important;
}

/* More visible anime atmosphere. */
#animeScene{
  background:
    radial-gradient(circle at 50% 35%,rgba(255,75,155,.22),transparent 38%),
    linear-gradient(180deg,#090513 0%,#230923 50%,#08040f 100%);
}

#sceneImage{
  opacity:.84!important;
  filter:saturate(1.18) contrast(1.08) brightness(.72);
}

/* Animated "talking" effect on the whole scene. */
#sceneImage.talking{
  animation:
    animeBreath 6s ease-in-out infinite alternate,
    talkZoom 2.8s ease-in-out infinite!important;
}

@keyframes talkZoom{
  0%,100%{filter:saturate(1.18) contrast(1.08) brightness(.72)}
  50%{filter:saturate(1.24) contrast(1.1) brightness(.80)}
}

/* Floating dialogue indicator. */
#animeDialogue{
  position:absolute;
  left:50%;
  bottom:11%;
  transform:translateX(-50%);
  width:min(88%,340px);
  padding:12px 17px;
  border-radius:20px;
  color:#fff;
  font-size:14px;
  line-height:1.6;
  text-align:center;
  background:rgba(12,4,20,.76);
  border:1px solid rgba(255,145,205,.38);
  box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 18px rgba(255,75,155,.16);
  backdrop-filter:blur(6px);
  z-index:1;
  opacity:0;
  transition:.35s;
  pointer-events:none;
}

#animeDialogue.show{
  opacity:1;
  animation:dialogueFloat 2.8s ease-in-out infinite;
}

@keyframes dialogueFloat{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-5px)}
}

.dialogueName{
  color:#ff9dca;
  font-weight:800;
}

/* Make love pages feel like illustrated anime cards rather than white cards. */
.loveInput{
  color:#fff;
  background:rgba(7,3,15,.58);
  border:1px solid rgba(255,150,208,.24);
}

.loveInput::placeholder{
  color:#ffd0e4;
}

.write-box{
  background:rgba(9,4,18,.48);
  border-color:rgba(255,145,205,.22);
}
.message-card{min-height:0;}
}


/* =========================================================
   FINAL UI FIXES
   ========================================================= */

/* Intro: full-screen anime conversation instead of the old plain card */
.intro-scene-card{
  width:100%;
  max-width:390px;
  min-height:560px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding:25px 16px 32px;
  border-radius:30px;
  background:linear-gradient(180deg,transparent 35%,rgba(8,3,16,.48) 72%,rgba(8,3,16,.72));
}

.intro-talk{
  width:min(88%,330px);
  padding:13px 16px;
  margin:7px 0;
  border-radius:20px;
  color:#fff;
  font-size:15px;
  line-height:1.65;
  text-align:left;
  background:rgba(15,5,25,.70);
  border:1px solid rgba(255,145,205,.45);
  box-shadow:0 8px 28px rgba(0,0,0,.35),0 0 20px rgba(255,75,155,.15);
  backdrop-filter:blur(7px);
  animation:talkBubbleIn .7s ease both;
}

.asad-talk{align-self:flex-start}
.aliza-talk{align-self:flex-end}
.small-talk{align-self:center}

.talk-name{
  color:#ff9dcc;
  font-weight:800;
  margin-bottom:3px;
}

.intro-open{
  margin-top:18px;
  min-width:150px;
  font-size:18px;
  animation:softPulse 1.8s ease-in-out infinite;
}

@keyframes talkBubbleIn{
  from{opacity:0;transform:translateY(18px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes softPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}

/* Only one navigation button per love page */
.love-page-nav{
  display:flex;
  gap:10px;
  width:100%;
  max-width:315px;
  margin-top:10px;
}
.love-page-nav .btn{
  flex:1;
  margin-top:0;
}
